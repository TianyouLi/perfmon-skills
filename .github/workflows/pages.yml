name: Deploy arch-map to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with perfmon submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install perfmon-skills
        run: pip install -e .

      - name: Generate arch-map HTMLs
        run: |
          mkdir -p _site
          perfmon-skills arch-map --platform GNR --out _site/gnr.html
          perfmon-skills arch-map --platform CWF --out _site/cwf.html

      - name: Render DMR (real page if data exists, stub otherwise)
        run: |
          if grep -q ',DMR,\|/DMR/' perfmon/mapfile.csv 2>/dev/null; then
            echo "DMR event data found upstream — rendering real arch-map"
            perfmon-skills arch-map --platform DMR --out _site/dmr.html
          else
            echo "DMR event data not yet published — writing stub page"
            python scripts/build_stub.py DMR _site/dmr.html
          fi

      - name: Generate landing index.html
        run: python scripts/build_index.py _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
